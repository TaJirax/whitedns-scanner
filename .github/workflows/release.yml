name: Release

# Push a tag such as v0.2.0 to build the desktop GUI for every platform and
# publish it as a GitHub release with checksums.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  builds:
    uses: ./.github/workflows/gui-builds.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: WhiteDNS-Scanner-*
          merge-multiple: true
      - name: Verify packages and write checksums
        shell: bash
        run: |
          rm -f dist/*.sha256
          test -s dist/WhiteDNS-Scanner-windows-amd64.zip
          test -s dist/WhiteDNS-Scanner-linux-amd64.tar.gz
          test -s dist/WhiteDNS-Scanner-linux-arm64.tar.gz
          test -s dist/WhiteDNS-Scanner-darwin-universal.zip
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "WhiteDNS Scanner $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
