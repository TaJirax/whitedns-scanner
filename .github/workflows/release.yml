name: Release

# Push a tag such as v0.2.0 to build the desktop GUI for every platform and
# publish one release with it, the Android app and the terminal app, plus
# checksums for every file.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  builds:
    uses: ./.github/workflows/gui-builds.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: WhiteDNS-Scanner-*
          merge-multiple: true
      - name: Add the Android app and terminal builds
        # Every WhiteDNS artifact ships in one release: the latest
        # WhiteDNS-cleanip-finder release carries the signed APKs, the AAB and
        # the terminal app for each platform.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R TaJirax/WhiteDNS-cleanip-finder -D dist --pattern '*.apk' --pattern '*.aab' --pattern 'whitedns-*'
      - name: Verify packages and write checksums
        shell: bash
        run: |
          rm -f dist/*.sha256 dist/README.md # each package already contains the README
          test -s dist/WhiteDNS-Scanner-windows-amd64.zip
          test -s dist/WhiteDNS-Scanner-linux-amd64.tar.gz
          test -s dist/WhiteDNS-Scanner-linux-arm64.tar.gz
          test -s dist/WhiteDNS-Scanner-darwin-universal.zip
          compgen -G 'dist/*.apk' >/dev/null
          compgen -G 'dist/*.aab' >/dev/null
          test -s dist/whitedns-windows-amd64.exe
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        # Assembled as a draft and published only once every file is attached,
        # so nobody downloads from a half-filled release.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "WhiteDNS $RELEASE_TAG" --notes-file docs/release-notes.md
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --title "WhiteDNS $RELEASE_TAG" --notes-file docs/release-notes.md --draft=false --latest
